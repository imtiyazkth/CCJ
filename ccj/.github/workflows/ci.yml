name: CCJ CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"
  PNPM_VERSION: "9.15.0"

jobs:
  # ── 1. TypeScript — typecheck + i18n ─────────────────────────
  ts-check:
    name: TypeScript — typecheck & i18n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @ccj/types build
          pnpm --filter @ccj/providers build

      - name: Typecheck all packages
        run: pnpm turbo run typecheck

      - name: i18n key consistency
        run: node scripts/check-i18n.mjs

  # ── 2. API unit + integration tests ──────────────────────────
  api-test:
    name: API — tests
    runs-on: ubuntu-latest
    needs: ts-check

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ccj_ci
          POSTGRES_PASSWORD: ci_password_not_for_prod
          POSTGRES_DB: ccj_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ccj_ci:ci_password_not_for_prod@localhost:5432/ccj_ci
      # Supabase vars are mocked in CI — auth is not tested against real Supabase
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci_anon_key_placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci_service_role_key_placeholder
      SUPABASE_JWT_SECRET: ci_jwt_secret_minimum_32_chars_here
      PROVIDER_MODE: demo
      WORKER_SECRET: ci_worker_secret_placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @ccj/types build
          pnpm --filter @ccj/providers build

      - name: Apply CI database schema (vanilla PostgreSQL — no auth.users)
        run: |
          psql "$DATABASE_URL" -f packages/db/src/migrations/ci_schema.sql
          echo "Schema applied — verifying tables:"
          psql "$DATABASE_URL" -t -A -c \
            "SELECT table_name FROM information_schema.tables WHERE table_schema='public' ORDER BY table_name;"

      - name: Run API tests
        run: pnpm --filter @ccj/api test

  # ── 3. Next.js build verification ────────────────────────────
  web-build:
    name: Web — Next.js build
    runs-on: ubuntu-latest
    needs: ts-check

    env:
      # Mock public vars for build — not used at runtime in CI
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder_anon_key_for_build_only
      NEXT_PUBLIC_API_URL: http://localhost:3001

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @ccj/types build
          pnpm --filter @ccj/providers build

      - name: Build Next.js
        run: pnpm --filter @ccj/web build

  # ── 4. Python worker ─────────────────────────────────────────
  python-check:
    name: Python — lint, type-check, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/research

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: workers/research/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-asyncio

      - name: Lint (ruff)
        run: ruff check app/

      - name: Compile check
        run: python -m compileall app/ -q

      - name: Run tests
        run: pytest tests/ -v
        env:
          WORKER_SECRET: ci_worker_secret
          DATABASE_URL: postgresql://noop:noop@localhost:5432/noop

  # ── 5. Secret scan ───────────────────────────────────────────
  secret-scan:
    name: Secret scan (trufflehog)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # ── 6. CodeQL ─────────────────────────────────────────────────
  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm --filter @ccj/types build
          pnpm --filter @ccj/providers build
      - uses: github/codeql-action/analyze@v3

  # ── 7. Docker build verification ─────────────────────────────
  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: [ts-check, python-check]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build research worker image
        uses: docker/build-push-action@v6
        with:
          context: ./workers/research
          push: false
          tags: ccj-research-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
