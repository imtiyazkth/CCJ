name: CCJ CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"
  PNPM_VERSION: "9.15.0"

jobs:
  # ── 1. TypeScript typecheck + lint ───────────────────────────
  ts-check:
    name: TypeScript — typecheck & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @ccj/types build
          pnpm --filter @ccj/providers build

      - name: Typecheck all packages
        run: pnpm turbo run typecheck

      - name: i18n key consistency
        run: node scripts/check-i18n.mjs

  # ── 2. API tests (no Redis, no Qdrant — in-memory queue) ─────
  api-test:
    name: API — unit tests
    runs-on: ubuntu-latest
    needs: ts-check

    # Only PostgreSQL required (Supabase URL not needed for unit tests)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ccj_ci
          POSTGRES_PASSWORD: ci_password_not_for_prod
          POSTGRES_DB: ccj_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ccj_ci:ci_password_not_for_prod@localhost:5432/ccj_ci
      # In CI, use a fake Supabase JWT secret — tests mock auth
      SUPABASE_JWT_SECRET: ci_jwt_secret_32_chars_minimum_ok
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci_anon_key
      SUPABASE_SERVICE_ROLE_KEY: ci_service_role_key
      PROVIDER_MODE: demo
      WORKER_SECRET: ci_worker_secret

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          pnpm --filter @ccj/types build
          pnpm --filter @ccj/providers build
          pnpm --filter @ccj/db build

      - name: Apply DB migration (fresh schema — no auth.users in CI)
        run: |
          # Run migration without the Supabase auth FK for CI
          # The auth.users reference is replaced by a local stub
          psql $DATABASE_URL -f packages/db/src/migrations/ci_schema.sql
        env:
          DATABASE_URL: postgresql://ccj_ci:ci_password_not_for_prod@localhost:5432/ccj_ci

      - name: Run API tests
        run: pnpm --filter @ccj/api test
        env:
          DATABASE_URL: postgresql://ccj_ci:ci_password_not_for_prod@localhost:5432/ccj_ci

  # ── 3. Python worker ─────────────────────────────────────────
  python-check:
    name: Python worker — lint, typecheck, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/research

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: workers/research/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-asyncio

      - name: Lint (ruff)
        run: ruff check app/

      - name: Type-check (mypy)
        run: mypy app/ --ignore-missing-imports

      - name: Compile check
        run: python -m compileall app/

      - name: Run tests
        run: pytest tests/ -v
        env:
          WORKER_SECRET: ci_worker_secret
          SEARXNG_URL: http://localhost:8888
          LIBRETRANSLATE_URL: http://localhost:5000
          DATABASE_URL: postgresql://noop:noop@localhost:5432/noop

  # ── 4. Secret scan ───────────────────────────────────────────
   # ── 4. Secret scan ───────────────────────────────────────────
  secret-scan:
    name: Secret scan (trufflehog)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unverified


  # ── 5. CodeQL ─────────────────────────────────────────────────
  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@ccj/types --filter=@ccj/providers
      - uses: github/codeql-action/analyze@v3

  # ── 6. Docker build verification ─────────────────────────────
  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: [ts-check, python-check]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build research worker
        uses: docker/build-push-action@v6
        with:
          context: ./workers/research
          push: false
          tags: ccj-research-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
