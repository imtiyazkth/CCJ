name: CCJ CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel redundant runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"
  PNPM_VERSION: "9.15.0"

jobs:
  # ────────────────────────────────────────────────────────────
  # 1. TypeScript — type-check, lint, test
  # ────────────────────────────────────────────────────────────
  ts-check:
    name: TypeScript — typecheck & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo run build --filter=@ccj/types --filter=@ccj/db

      - name: Type-check
        run: pnpm turbo run typecheck

      - name: Lint
        run: pnpm turbo run lint

  # ────────────────────────────────────────────────────────────
  # 2. TypeScript tests
  # ────────────────────────────────────────────────────────────
  ts-test:
    name: TypeScript — tests
    runs-on: ubuntu-latest
    needs: ts-check

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ccj_test
          POSTGRES_PASSWORD: test_password_ci
          POSTGRES_DB: ccj_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://ccj_test:test_password_ci@localhost:5432/ccj_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci_test_jwt_secret_not_for_production_use
      JWT_REFRESH_SECRET: ci_test_refresh_secret_not_for_production_use
      WORKER_SECRET: ci_test_worker_secret

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo run build --filter=@ccj/types --filter=@ccj/db

      - name: Run DB migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://ccj_test:test_password_ci@localhost:5432/ccj_test

      - name: Run tests
        run: pnpm turbo run test
        env:
          NODE_ENV: test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ts-coverage
          path: "**/coverage/**"

  # ────────────────────────────────────────────────────────────
  # 3. Python worker — lint, type-check, tests
  # ────────────────────────────────────────────────────────────
  python-check:
    name: Python worker — lint & type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/research

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: workers/research/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-asyncio httpx[test]

      - name: Lint (ruff)
        run: ruff check app/

      - name: Type-check (mypy)
        run: mypy app/ --ignore-missing-imports --strict

      - name: Run tests
        run: pytest tests/ -v
        env:
          DATABASE_URL: postgresql://noop:noop@localhost:5432/noop
          WORKER_SECRET: ci_test_worker_secret
          SEARXNG_URL: http://localhost:8888
          LIBRETRANSLATE_URL: http://localhost:5000

  # ────────────────────────────────────────────────────────────
  # 4. Security scan — secrets, vulnerabilities
  # ────────────────────────────────────────────────────────────
  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Detect hardcoded secrets
      - name: Detect secrets (trufflehog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

      # SAST for TS/JS
      - name: Run CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo run build

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

      # Python safety check
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Safety check (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r workers/research/requirements.txt

  # ────────────────────────────────────────────────────────────
  # 5. Docker build verification
  # ────────────────────────────────────────────────────────────
  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: [ts-check, python-check]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build research worker image
        uses: docker/build-push-action@v6
        with:
          context: ./workers/research
          push: false
          tags: ccj-research-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          push: false
          tags: ccj-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          push: false
          tags: ccj-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────────
  # 6. i18n validation — all locale keys consistent
  # ────────────────────────────────────────────────────────────
  i18n-check:
    name: i18n — locale key consistency
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check locale keys are consistent across all locales
        run: node scripts/check-i18n.mjs
